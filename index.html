<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1724">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MeditoPedia">
<meta name="description" content="MeditoPedia — meditazione, respirazione, rilassamento, sonno e suoni rilassanti">
<title>MeditoPedia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%239cb8a0'/><circle cx='50' cy='50' r='26' fill='%230f1724'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=21">
</head>
<body>
<a class="skip" href="#vista">Vai al contenuto</a>
<div class="wrap">
  <header class="top">
    <button class="logo" data-act="vai" data-v="home" aria-label="MeditoPedia, home"><i></i><span>Medito<b>Pedia</b></span></button>
    <button class="icbtn" data-act="vai" data-v="impostazioni" aria-label="Impostazioni"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </header>
  <main id="vista" tabindex="-1"></main>
  <footer>MeditoPedia · la tua enciclopedia della calma</footer>
</div>

<div id="mini" role="region" aria-label="Suoni in riproduzione">
  <span class="eq"><i></i><i></i><i></i></span><button id="miniTxt" data-act="miniapri" aria-label="Apri">In riproduzione</button>
  <button class="icbtn sm" id="miniPlay" data-act="minplay" aria-label="Pausa o riprendi"></button>
  <button class="icbtn sm mini-suoni" data-act="vai" data-v="suoni" aria-label="Apri i suoni"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
  <button class="icbtn sm" data-act="musstop" aria-label="Ferma"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
</div>

<nav class="bottom" aria-label="Navigazione principale"><div class="in">
  <button data-act="vai" data-v="home"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Oggi</button>
  <button data-act="vai" data-v="esplora"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Esplora</button>
  <button data-act="vai" data-v="respiro"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>Respiro</button>
  <button data-act="vai" data-v="suoni"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Suoni</button>
  <button data-act="vai" data-v="tu"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Tu</button>
</div></nav>

<!-- LETTORE DELLE SESSIONI -->
<div id="player" role="dialog" aria-modal="true" aria-label="Sessione in corso">
  <div class="pl-top">
    <button class="icbtn" data-act="plclose" aria-label="Riduci a finestra (la sessione continua)" title="Riduci"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="ttl"><small id="plProg"></small><b id="plTitle"></b></div>
    <button class="icbtn" data-act="plmin" aria-label="Modalità minimale" title="Schermo minimale"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button class="icbtn" data-act="plpanel" aria-label="Volumi e timer" title="Volumi e timer"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
  </div>
  <div class="pl-center" data-act="plplay">
    <div id="plPausedTag">In pausa · tocca per continuare</div>
    <div class="orb-wrap"><div class="orb idle" id="orb"><span id="orbLabel"></span><span id="orbCount"></span></div></div>
    <p id="plText" aria-live="polite"></p>
    <div id="plStats"></div>
  </div>
  <div class="pl-bottom">
    <div class="pl-opt">
      <select id="plBg" aria-label="Sottofondo"></select>
      <button class="chip" id="plSleep" data-act="plpanel" aria-label="Timer di autospegnimento"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span id="plSleepLbl"></span></button>
    </div>
    <div class="bar" data-act="plseek" role="slider" aria-label="Avanzamento"><i id="plBar"></i></div>
    <div class="pl-time"><span id="plEl">0:00</span><span id="plRem"></span></div>
    <div class="pl-ctrl">
      <button class="icbtn" id="plVoice" data-act="plvoice" aria-label="Voce guida"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="icbtn" data-act="plrestart" aria-label="Ricomincia dall'inizio" title="Ricomincia"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <button class="icbtn" data-act="plprev" aria-label="Indietro"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M19 5L9 12l10 7z" fill="currentColor"/><path d="M5 5v14"/></svg></button>
      <button class="big" id="plPlay" data-act="plplay" aria-label="Pausa"></button>
      <button class="icbtn" data-act="plskip" aria-label="Avanti"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5l10 7-10 7z" fill="currentColor"/><path d="M19 5v14"/></svg></button>
      <button class="icbtn" data-act="plstop" aria-label="Termina"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div id="plPanel" class="sheet"></div>
  <div id="plPrep"><div class="spinner"></div><p id="plPrepTxt">Preparo la sessione…</p></div>
  <div id="plDone">
    <div class="done-orb"></div>
    <h1>Pratica completata</h1>
    <p class="muted" id="doneInfo"></p>
    <p>Come ti senti adesso?</p>
    <div class="moods" id="moods"><button data-m="1" aria-label="Male">😣</button><button data-m="2" aria-label="Non bene">😕</button><button data-m="3" aria-label="Così così">😐</button><button data-m="4" aria-label="Bene">🙂</button><button data-m="5" aria-label="Sereno">😌</button></div>
    <div class="row" style="justify-content:center"><button class="btn ghost" data-act="plrestart">Ricomincia</button><button class="btn" data-act="pldone">Torna all'app</button></div>
  </div>
</div>

<script src="js/base.js?v=21"></script>
<script src="js/contenuti.js?v=21"></script>
<script src="sessioni-extra.js?v=21"></script>
<script src="umore.js?v=21"></script>
<script src="js/catalogo.js?v=21"></script>
<script src="js/audio.js?v=21"></script>
<script src="js/voce.js?v=21"></script>
<script src="js/motore.js?v=21"></script>
<script src="js/sfondo.js?v=21"></script>
<script src="js/app.js?v=21"></script>
<script src="pwa.js?v=21"></script>
<script src="aggiorna.js?v=21"></script>
<script src="crediti.js?v=21"></script>
</body>
</html>
