# Costruisce l'APK Android di MeditoPedia ad ogni aggiornamento del ramo main
# e lo pubblica nella release "android-latest":
# https://github.com/rupi7800-blip/meditopedia/releases/download/android-latest/MeditoPedia.apk
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEY_PASS: ${{ secrets.KEYSTORE_PASS || 'NblLyY7gZTAsx6bztRzx_e9m' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepara i file dell'app
        run: |
          mkdir -p build/www
          cp index.html *.js manifest.webmanifest build/www/
          rm -f build/www/sw.js
          cp -r icone audio build/www/

      - name: Crea il progetto Android (Capacitor)
        working-directory: build
        run: |
          npm init -y > /dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3
          npx cap init MeditoPedia it.meditopedia.app --web-dir www
          npx cap add android
          mkdir -p assets
          cp www/icone/icona-1024.png assets/icon-only.png
          cp www/icone/icona-1024.png assets/icon-foreground.png
          python3 -c "from PIL import Image" 2>/dev/null || pip install pillow
          python3 -c "from PIL import Image; Image.new('RGB',(1024,1024),(13,19,32)).save('assets/icon-background.png'); Image.new('RGB',(2732,2732),(13,19,32)).save('assets/splash.png'); Image.new('RGB',(2732,2732),(13,19,32)).save('assets/splash-dark.png')"
          npx capacitor-assets generate --android --iconBackgroundColor '#0d1320' --iconBackgroundColorDark '#0d1320' --splashBackgroundColor '#0d1320' --splashBackgroundColorDark '#0d1320'
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Compila l'APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Firma l'APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=build/android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f -p 4 $IN aligned.apk
          $BT/apksigner sign --ks android-firma/meditopedia.jks --ks-key-alias meditopedia --ks-pass env:KEY_PASS --key-pass env:KEY_PASS --out MeditoPedia.apk aligned.apk
          $BT/apksigner verify MeditoPedia.apk

      - name: Pubblica nella release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest MeditoPedia.apk \
            --title "MeditoPedia per Android (1.${{ github.run_number }})" \
            --notes "Scarica **MeditoPedia.apk**, aprilo sul telefono e consenti l'installazione quando Android lo chiede. Gli aggiornamenti si installano sopra la versione precedente senza perdere i progressi." \
            --latest
